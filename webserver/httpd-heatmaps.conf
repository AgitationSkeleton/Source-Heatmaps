# Source Heatmaps: a separate, static-only Apache instance (no PHP, no CGI, no directory listings).
# It listens on loopback only; publish it through a reverse proxy or a Cloudflare Tunnel.
#
# Install as its own Windows service (from an elevated prompt):
#   httpd.exe -k install -n SourceHeatmapsWeb -f "<HM_ROOT>/conf/httpd-heatmaps.conf"
# Test the config:  httpd.exe -t -f "<HM_ROOT>/conf/httpd-heatmaps.conf"

Define APACHE_ROOT "C:/Apache24"
Define HM_ROOT "C:/srv/source-heatmaps"
Define HM_LISTEN "127.0.0.1:8095"

ServerRoot "${APACHE_ROOT}"
Listen ${HM_LISTEN}
ServerName heatmaps.local
PidFile "${HM_ROOT}/logs/httpd.pid"

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule headers_module modules/mod_headers.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule remoteip_module modules/mod_remoteip.so
LoadModule allowmethods_module modules/mod_allowmethods.so

ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag MTime Size
Timeout 30
KeepAlive On
MaxKeepAliveRequests 200
KeepAliveTimeout 5
RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500
LimitRequestBody 1024
LimitRequestFields 50
LimitRequestFieldSize 4096
LimitRequestLine 4094
ThreadsPerChild 64

# Real client IPs from Cloudflare (the tunnel connects from loopback)
RemoteIPHeader CF-Connecting-IP
RemoteIPInternalProxy 127.0.0.1 ::1

# rotated logs: at most 5 x 50 MB each, so public traffic can't fill the disk
ErrorLog "|bin/rotatelogs.exe -n 5 ${HM_ROOT}/logs/error.log 50M"
LogLevel warn
LogFormat "%a %t \"%r\" %>s %B \"%{User-Agent}i\" %D" hm
CustomLog "|bin/rotatelogs.exe -n 5 ${HM_ROOT}/logs/access.log 50M" hm

TypesConfig "${HM_ROOT}/conf/mime.types"
AddType application/octet-stream .bin
AddType application/json .json
AddType text/javascript .js
AddCharset utf-8 .html .js .css .json

AddOutputFilterByType DEFLATE text/html text/css text/javascript application/json application/octet-stream

<Directory />
    AllowOverride None
    Options None
    Require all denied
</Directory>

DocumentRoot "${HM_ROOT}/www"
<Directory "${HM_ROOT}/www">
    AllowOverride None
    Options None
    DirectoryIndex index.html
    # read-only site: every other method (POST, PUT, DELETE, OPTIONS, ...) gets 405
    AllowMethods GET HEAD
    Require all granted
</Directory>

# never serve dotfiles, temp files or anything that is not a site asset
<FilesMatch "(?i)^\.|\.(tmp|bak|py|pyc|cfg|conf|ini|log|sql|md|pid|types)$">
    Require all denied
</FilesMatch>

Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "no-referrer"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
Header always set Cross-Origin-Opener-Policy "same-origin"
Header always unset X-Powered-By

# data changes every few minutes: revalidate; vendor code and icons rarely change
# (?i): Windows paths are case-insensitive, so the header rules must be too
<LocationMatch "(?i)^/data/">
    Header set Cache-Control "public, max-age=60, must-revalidate"
    # read-only public data: let other tools (bot/nav tooling) fetch it cross-origin
    Header set Access-Control-Allow-Origin "*"
</LocationMatch>
<LocationMatch "(?i)^/(vendor|icons)/">
    Header set Cache-Control "public, max-age=86400"
</LocationMatch>
<LocationMatch "(?i)^/(index\.html|app\.js|style\.css)?$">
    Header set Cache-Control "public, max-age=300, must-revalidate"
</LocationMatch>
